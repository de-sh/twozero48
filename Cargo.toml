[package]
name = "twozero48"
version = "1.0.0"
authors = ["Devdutt Shenoi <devdutt@outlook.in>"]
edition = "2024"
license = "MIT"
repository = "https://github.com/de-sh/twozero48"
description = "A CLI implementation of 2048, in rust"

[dependencies]
clap = { version = "4.6", features = ["derive", "cargo"] }
crossterm = "0.29"
rand = "0.10"
ratatui = "0.30"

[dev-dependencies]
criterion = "0.8"

[[bin]]
name = "twozero48"
path = "bin/main.rs"

[[bench]]
name = "board_moves"
harness = false

[[bench]]
name = "turn_waterfall"
harness = false
