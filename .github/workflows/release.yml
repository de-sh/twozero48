name: Release Binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to upload native binaries to.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-binaries
  cancel-in-progress: false

jobs:
  binaries:
    name: Build ${{ matrix.label }} binary
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: apple-aarch64
            os: macos-14
            target: aarch64-apple-darwin
            archive: twozero48-aarch64-apple-darwin.tar.gz
          - label: linux-amd64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: twozero48-x86_64-unknown-linux-gnu.tar.gz
          - label: windows-amd64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: twozero48-x86_64-pc-windows-msvc.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build binary
        run: cargo build --locked --release --bin twozero48 --target ${{ matrix.target }}

      - name: Package Unix binary
        if: runner.os != 'Windows'
        run: |
          mkdir -p "artifacts/${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/twozero48" "artifacts/${{ matrix.target }}/"
          cp README.md LICENSE "artifacts/${{ matrix.target }}/"
          tar -C artifacts -czf "${{ matrix.archive }}" "${{ matrix.target }}"

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "artifacts/${{ matrix.target }}" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/twozero48.exe" "artifacts/${{ matrix.target }}/"
          Copy-Item README.md,LICENSE "artifacts/${{ matrix.target }}/"
          Compress-Archive -Path "artifacts/${{ matrix.target }}" -DestinationPath "${{ matrix.archive }}" -Force

      - name: Upload binary to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" "${{ matrix.archive }}" --clobber
